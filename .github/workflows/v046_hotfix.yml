name: Finish v0.4.6 region aliases

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v046-alias-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix region aliases
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('custom_components/p2000_monitor/coordinator.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"simpeleveld",', '"simpelveld",')
          s = s.replace('"heerlen", "kerkrade", "landgraaf", "maastricht", "meerssen",', '"heerlen", "hoensbroek", "heerlerheide", "welten", "kerkrade", "landgraaf", "maastricht", "meerssen",')
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile custom_components/p2000_monitor/coordinator.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/p2000_monitor/coordinator.py
          git diff --cached --check
          git commit -m "Fix v0.4.6 region aliases [v046-alias-auto]"
          git push
