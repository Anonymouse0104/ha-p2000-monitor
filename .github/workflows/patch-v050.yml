name: Apply v0.5.0 sensor migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply v0.5.0 sensor migration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sensor platform
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('custom_components/p2000_monitor/sensor.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('from .coordinator import (\n    P2000DataCoordinator,\n    extract_priority,\n)', 'from .coordinator_v2 import (\n    P2000DataCoordinator,\n)\nfrom .coordinator import extract_priority')
          marker = 'async def async_setup_platform(\n'
          if 'async def async_setup_entry(' not in s:
              fn = '''async def async_setup_entry(\n    hass: HomeAssistant,\n    entry,\n    async_add_entities: AddEntitiesCallback,\n) -> None:\n    """Set up a user-configured P2000 filter from the UI."""\n    data = dict(entry.data)\n    filter_config = {\n        CONF_NAME: data.get(CONF_NAME, entry.title),\n        CONF_REGIONS: data.get(CONF_REGIONS, []),\n        CONF_DISCIPLINES: data.get(CONF_DISCIPLINES, []),\n        CONF_PRIORITIES: data.get(CONF_PRIORITIES, []),\n        CONF_CAPCODES: data.get(CONF_CAPCODES, []),\n        CONF_INCLUDE_TEXT: data.get(CONF_INCLUDE_TEXT, []),\n        CONF_EXCLUDE_TEXT: data.get(CONF_EXCLUDE_TEXT, []),\n    }\n    coordinator = P2000DataCoordinator(\n        hass=hass,\n        exclude_capcodes=[],\n        incident_window=data.get(CONF_INCIDENT_WINDOW, DEFAULT_INCIDENT_WINDOW),\n        api_filter={\n            "regios": filter_config[CONF_REGIONS],\n            "diensten": filter_config[CONF_DISCIPLINES],\n            "capcodes": filter_config[CONF_CAPCODES],\n            "melding": filter_config[CONF_INCLUDE_TEXT],\n            "priorities": filter_config[CONF_PRIORITIES],\n            "include_text": filter_config[CONF_INCLUDE_TEXT],\n            "exclude_text": filter_config[CONF_EXCLUDE_TEXT],\n        },\n    )\n    await coordinator.async_config_entry_first_refresh()\n    async_add_entities([P2000FilterSensor(coordinator, filter_config, 0)], True)\n\n\n'''
              s = s.replace(marker, fn + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/p2000_monitor/sensor.py
          git commit -m 'chore: apply v0.5.0 sensor migration' || exit 0
          git push
      - name: Remove migration workflow
        if: success()
        run: |
          git rm .github/workflows/patch-v050.yml || true
          git commit -m 'chore: remove temporary v0.5.0 migration workflow' || true
          git push || true
