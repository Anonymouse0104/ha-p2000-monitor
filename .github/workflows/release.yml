name: Create release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'prepare v0.5.2')
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.5.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.2 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "P2000 Monitor v0.5.2 – API filtering & timestamp fix" \
            --notes "## P2000 Monitor v0.5.2\n\n### Fixes\n- Parse AlarmeringDroid's separate `datum` and `tijd` fields into stable timestamps.\n- Stop treating every API message as if it arrived at the current time.\n- Keep priority, include-text and exclude-text filters local so unsupported API filter parameters cannot suppress valid messages.\n- Correct the official region name to **Zuid-Limburg**.\n- Recognize the API's `regioid` field directly.\n\n### Validation\n- Verified against the live AlarmeringDroid API with `regios=[21]` and `diensten=[2]`.\n- Live API response contains current Zuid-Limburg brandweer incidents."
