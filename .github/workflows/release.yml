name: Create release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'prepare v0.6.1')
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.6.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.6.1 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "P2000 Monitor v0.6.1 – clean sensor configuration" \
            --notes "## P2000 Monitor v0.6.1\n\n### Recommended sensor layout\n- P2000 Monitor: no filters, complete national feed.\n- P2000 Test: Limburg-Noord + Zuid-Limburg, Brandweer only.\n- Brandweer Echt: capcodes only.\n- Brandweer Limburg-Noord: region + Brandweer.\n- Brandweer Zuid-Limburg: region + Brandweer.\n- Brandweer Limburg: no longer recommended.\n\n### Other changes\n- Config Flow remains fully user-configurable.\n- Updated README with clean-install migration procedure.\n- No sensor.yaml configuration is required for Config Flow sensors.\n- Correct Limburg region names remain in use."
