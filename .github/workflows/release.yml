name: Create release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'prepare v0.6.0')
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.6.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.6.0 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "P2000 Monitor v0.6.0 – monitor and capcode filtering fixes" \
            --notes "## P2000 Monitor v0.6.0\n\n### Fixes\n- Fetch the complete AlarmeringDroid feed and apply filters locally.\n- Add an explicit 'Toon alle meldingen' mode for a complete national monitor.\n- Existing entries named P2000 Monitor are migrated to the unfiltered monitor mode.\n- Fix capcode filtering for grouped alerts: any matching capcode now passes.\n- Do not apply the same Config Flow filter a second time in the sensor.\n- Keep newest-message selection based on publication timestamp.\n- Use correct Dutch Veiligheidsregio names, including Limburg-Noord and Zuid-Limburg.\n\n### Compatibility\n- Existing Config Flow configurations remain usable.\n- No sensor.yaml configuration is required for Config Flow entries.\n- Legacy YAML support remains available."
