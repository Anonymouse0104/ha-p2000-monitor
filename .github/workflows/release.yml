name: Create release

# Push a commit whose message contains "prepare vX.Y.Z" to main. The version is
# read from manifest.json and the notes from .github/release-notes.md, so this
# workflow does not need editing per release.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'prepare v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release from manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(jq -r .version custom_components/p2000_monitor/manifest.json)"
          if gh release view "$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $version already exists, skipping."
            exit 0
          fi
          gh release create "$version" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "P2000 Monitor $version" \
            --notes-file .github/release-notes.md
