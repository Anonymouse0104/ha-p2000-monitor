name: Create release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'prepare v0.5.6')
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.5.6 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.6 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "P2000 Monitor v0.5.6 – newest matching message fix" \
            --notes "## P2000 Monitor v0.5.6\n\n### Fixes\n- Always select the newest matching P2000 message by publication timestamp.\n- Sort matching message history newest-first.\n- Sort matching incident history by last-seen/first-seen timestamp.\n- Keep Config Flow filtering and AlarmeringDroid API processing unchanged.\n\n### Why\nThe API result order is not guaranteed to have the newest matching message first. This release fixes the sensor selecting an older matching incident while newer messages were already available.\n\n### Compatibility\n- Existing Config Flow configurations remain usable.\n- The legacy YAML path remains supported."
