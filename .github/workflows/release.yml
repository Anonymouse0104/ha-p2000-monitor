name: Create release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'prepare v0.5.7')
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.5.7 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.7 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "P2000 Monitor v0.5.7 – unfiltered API and local filtering" \
            --notes "## P2000 Monitor v0.5.7\n\n### Fixes\n- Stop sending unsupported JSON filter payloads to the AlarmeringDroid /api2/find/ endpoint.\n- Fetch the complete feed and apply all configured filters locally.\n- Correctly parse API capcodes when they are returned as objects inside the capcodes array.\n- A capcode filter now matches when any capcode in a grouped P2000 message matches.\n- Keep newest-message selection based on publication timestamp.\n- Preserve Config Flow filtering, incident history and test injection.\n\n### Important\nThis release addresses the issue where valid incidents visible on the AlarmeringDroid monitor were missing from P2000 Monitor and filtered sensors.\n\n### Compatibility\n- Existing Config Flow configurations remain usable.\n- No sensor.yaml configuration is required for Config Flow entries."
